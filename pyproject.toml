[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turnlab"
version = "0.1.0"
description = "Local voice-agent regression evaluation toolkit"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1.2,<2"]
test = ["httpx>=0.27,<1"]
evaluation = ["openai>=2,<3", "python-dotenv>=1.2,<2"]
voice = ["livekit-agents[groq,deepgram,silero]==1.8.8", "python-dotenv>=1.2,<2"]

[project.scripts]
turnlab = "turnlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

