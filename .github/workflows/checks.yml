name: Local MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-voice.lock
      - run: python -m pip install -e ".[api,voice,test,evaluation]"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m turnlab pilot-demo
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
